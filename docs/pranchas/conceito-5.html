<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prancha 5 · Códice Orokin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prancha.css">
<style>
:root{--bg:#0d0c0a;--panel:#16140f;--line:#3d3424;--text:#f2e9d4;--muted:#b3a586;--gold:#dcb75c;--gold2:#f6dc93;--void:#8fe3dc;--flesh:#ec8c9c}
:root[data-theme="light"]{--bg:#f6f2e9;--panel:#fffdf8;--line:#dccfb2;--text:#1d1a14;--muted:#5c5341;--gold:#86620f;--gold2:#a77c1a;--void:#0d6a63;--flesh:#a3354a}
.rc{background:var(--bg);color:var(--text);font:400 16.5px/1.6 Spectral,serif}
.ok-hero{display:grid;grid-template-columns:1fr minmax(200px,260px) 1fr;align-items:center;gap:24px;padding:34px 28px 10px;text-align:center}
.arch{position:relative;aspect-ratio:3/4;border-radius:999px 999px 6px 6px;padding:7px;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--line))}
.arch::before{content:"";position:absolute;inset:3px;border-radius:inherit;border:1px solid var(--bg);pointer-events:none;z-index:1}
.arch img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:999px 999px 2px 2px}
.ok-side .big{display:block;font:400 92px/1 Italiana,serif;color:var(--gold);font-variant-numeric:tabular-nums}
.ok-side small{display:block;font:italic 300 16px Spectral,serif;color:var(--muted)}
.ok-side .cap{font:400 12px Italiana,serif;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ok-title{text-align:center;padding:16px 28px 8px}
.ok-title h1{font:400 76px/1 Italiana,serif;letter-spacing:.14em;margin:0;text-transform:uppercase}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:12px auto}
.orn::before,.orn::after{content:"";width:min(160px,22%);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn i{width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg)}
.orn i:nth-child(2){width:12px;height:12px;background:var(--gold)}
.ok-title p{font:italic 300 19px/1.5 Spectral,serif;max-width:46ch;margin:0 auto;color:var(--muted)}
.ok-title p b{font-style:normal;font-weight:600;color:var(--flesh)}
.chap{padding:26px 28px;border-top:1px solid var(--line)}
.chap-h{text-align:center;margin-bottom:18px}
.chap-h span{display:block;font:400 12px Italiana,serif;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.chap-h h2{font:400 34px/1.1 Italiana,serif;letter-spacing:.06em;margin:4px 0 0}
.nums{display:grid;grid-template-columns:repeat(3,1fr)}
.nums div{text-align:center;padding:4px 18px;border-left:1px solid var(--line)}
.nums div:first-child{border-left:0}
.nums b{display:block;font:400 54px/1.1 Italiana,serif;color:var(--gold)}
.nums span{font-size:15px;color:var(--muted)}
.ledger{max-width:760px;margin:0 auto;display:grid;gap:4px}
.row{position:relative;display:grid;grid-template-columns:44px 30px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;min-height:56px;padding:10px 12px;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.row:hover{background:var(--panel)}
.row .rn{font:400 22px Italiana,serif;color:var(--muted);text-align:center}
.glyph{width:26px;height:26px}
.glyph circle,.glyph path{fill:none;stroke:var(--gold);stroke-width:1.3}
.glyph .fill{fill:var(--gold);stroke:none;transform:scale(0);transform-origin:13px 13px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.row .nm{font:400 24px/1.2 Italiana,serif;letter-spacing:.02em}
.row .nt{display:block;font:italic 300 14px Spectral,serif;color:var(--muted)}
.row .cs{font:600 15px Spectral,serif;font-variant:small-caps;letter-spacing:.06em;color:var(--flesh);white-space:nowrap}
.row[data-on="1"] .glyph .fill{transform:scale(1)}
.row[data-on="1"] .nm{color:var(--gold)}
.row[data-on="1"] .nt::before{content:"Tributo pago · ";font-style:normal;color:var(--gold)}
.row::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--gold2) 45%,transparent) 48%,transparent 66%);transform:translateX(-110%);pointer-events:none}
.row[data-on="1"][data-just="1"]::after{animation:oksheen 1.1s ease-out}
@keyframes oksheen{to{transform:translateX(110%)}}
.fili{display:flex;align-items:center;max-width:560px;margin:22px auto 6px}
.fili .seg{flex:1;height:1px;background:var(--line);position:relative}
.fili .seg::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .6s}
.fili .seg.on::after{transform:scaleX(1)}
.fili .med{width:22px;height:22px;flex:none;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center}
.fili .med::after{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--line);transition:background .5s}
.fili .med.on::after{background:var(--gold)}
.ok-left{text-align:center;font-style:italic;color:var(--muted);margin:6px 0 0}
.ok-left b{font-style:normal;color:var(--text);font-weight:600}
.cols{columns:2;column-gap:36px;max-width:820px;margin:0 auto}
.cols p{margin:0 0 14px;break-inside:avoid}
.cols p:first-child::first-letter{float:left;font:400 64px/.8 Italiana,serif;color:var(--gold);margin:6px 10px 0 0}
.cols b{font-weight:600}
@container rc (max-width:640px){
  .ok-hero{grid-template-columns:1fr 1fr;gap:14px;padding:26px 18px 4px}
  .ok-hero .arch{grid-column:1/-1;grid-row:1;width:64%;margin:0 auto}
  .ok-side .big{font-size:60px}
  .ok-title{padding:12px 18px 4px}
  .ok-title h1{font-size:46px;letter-spacing:.1em}
  .ok-title p{font-size:17px}
  .chap{padding:22px 18px}
  .chap-h h2{font-size:28px}
  .nums{grid-template-columns:1fr}
  .nums div{border-left:0;border-top:1px solid var(--line);padding:10px 0}
  .nums div:first-child{border-top:0}
  .nums b{font-size:44px}
  .row{grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 4px}
  .row .rn{display:none}
  .row .nm{font-size:20px}
  .cols{columns:1}
}
</style>
</head>
<body>
<script src="../../assets/js/data.js"></script>
<script src="prancha.js"></script>
<script>
(function () {
  const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
  PR.init({
    n: 5,
    nome: 'Códice Orokin',
    fonte: 'estética da era e do material',
    frase: 'O guia é um <b>códice Orokin</b> de ouro e mármore, com o mesmo acabamento do seu Xaku Prime: uma peça editorial, simétrica e calma, onde cada compra é um tributo selado a ouro.',
    paletas: {
      dark: { nome: 'Void Dourado', sub: 'Escuro · ouro sobre o Void', cores: [['Void', '#0d0c0a'], ['Painel', '#16140f'], ['Filete', '#3d3424'], ['Texto', '#f2e9d4'], ['Ouro', '#dcb75c'], ['Ouro claro', '#f6dc93'], ['Moonflesh', '#ec8c9c']] },
      light: { nome: 'Mármore Orokin', sub: 'Claro · o salão de mármore da Torre', cores: [['Mármore', '#f6f2e9'], ['Painel', '#fffdf8'], ['Filete', '#dccfb2'], ['Texto', '#1d1a14'], ['Ouro velho', '#86620f'], ['Ouro', '#a77c1a'], ['Moonflesh', '#a3354a']] },
    },
    fontes: [
      { nome: 'Italiana', uso: 'títulos, numerais gigantes, nomes', css: 'Italiana', amostra: 'TAUBOUND · 1.625' },
      { nome: 'Spectral', uso: 'texto, itálicos, versaletes', css: 'Spectral', amostra: 'Gaste tudo, nem que seja em Endo.' },
    ],
    assinatura: 'Pagar um tributo faz uma <b>folha de ouro</b> atravessar a linha da lista e o selo Orokin se preencher. Os <b>medalhões da filigrana</b> acendem um a um, ligados por fios de ouro. O topo é simétrico: dias e horas como numerais monumentais dos dois lados do arco com o seu Xaku.',
    experimente: 'pague a Azure e a Amber; troque para Mármore Orokin.',
    pecas: [
      ['Topo', 'Arco dourado com a sua foto do Xaku Prime entre os numerais da contagem.'],
      ['Seções', 'Capítulos em algarismos romanos com títulos de códice (“A colheita”, “Os tributos”, “Onde colher”).'],
      ['Loja / checklist', 'Livro-razão de tributos: numeral, selo, nome em Italiana e custo em versalete.'],
      ['Progresso', 'Filigrana com um medalhão por item da prioridade 1.'],
      ['Missões', 'Texto editorial em duas colunas com capitular, em vez de tabela.'],
      ['Armadilhas', 'Notas de rodapé numeradas do códice (†, ‡).'],
      ['Seu loadout', 'Prancha de retrato: as três fotos do Xaku em arcos lado a lado.'],
    ],
    render(root) {
      const z = PR.mission('Zabala'), x = PR.mission('Xini'), a = PR.mission('Locus Alerts');
      const n = PR.p1().length;
      root.innerHTML = `
      <div class="ok-hero">
        <div class="ok-side"><div class="cap">Restam</div><b class="big" data-c="d"></b><small>dias</small></div>
        <div class="arch"><img src="../../img/xaku1.jpg" alt="Xaku Prime dourado no Orbiter"></div>
        <div class="ok-side"><div class="cap">e</div><b class="big" data-c="hm"></b><small>horas e minutos</small></div>
      </div>
      <div class="ok-title"><h1>Taubound</h1><div class="orn"><i></i><i></i><i></i></div>
        <p>Um códice para o Tenno que tem pouco tempo. Colha a <b>Moonflesh</b> de Eris e pague os tributos da Praghasa antes de 17 de novembro.</p></div>
      <section class="chap"><div class="chap-h"><span>Capítulo I</span><h2>A colheita</h2></div>
        <div class="nums"><div><b>2 / 3</b><span>por drop, Normal e Steel Path</span></div><div><b>50 / 75</b><span>por Alert concluído</span></div><div><b>1.625</b><span>a meta mínima de progresso</span></div></div></section>
      <section class="chap"><div class="chap-h"><span>Capítulo II</span><h2>Os tributos</h2></div>
        <div class="ledger">${PR.p1().map((i, k) => `<button class="row" type="button" data-item="${i.id}"><span class="rn">${ROMAN[k]}</span>
          <svg class="glyph" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5"/><path d="M13 4 L22 13 L13 22 L4 13 Z"/><path class="fill" d="M13 8 L18 13 L13 18 L8 13 Z"/></svg>
          <span><span class="nm">${i.name}</span><span class="nt">${i.note}</span></span><span class="cs">${i.cost} moonflesh</span></button>`).join('')}</div>
        <div class="fili">${Array.from({ length: n }, (_, k) => `<span class="med"></span>${k < n - 1 ? '<span class="seg"></span>' : ''}`).join('')}</div>
        <p class="ok-left"></p></section>
      <section class="chap"><div class="chap-h"><span>Capítulo III</span><h2>Onde colher</h2></div>
        <div class="cols">
          <p>Comece sempre pelos <b>${a.node}</b> (${a.bonus}). Eles surgem em Eris a cada meia hora, mais ou menos, e podem se acumular até três.</p>
          <p>Para o farm contínuo, <b>${z.node}</b> (${z.type}) é o caminho mais rápido, e ainda rende ${z.bonus.toLowerCase()}. Em squad público o pickup é compartilhado.</p>
          <p>Se precisar de relíquias Axi, troque por <b>${x.node}</b> (${x.type}): ${x.bonus.replace('*', '')}.</p>
        </div></section>`;
    },
    update(root) {
      const ids = PR.p1().map(i => !!PR.state[i.id]);
      root.querySelectorAll('.fili .med').forEach((m, k) => m.classList.toggle('on', ids[k]));
      root.querySelectorAll('.fili .seg').forEach((s, k) => s.classList.toggle('on', ids[k] && ids[k + 1]));
      const paid = ids.filter(Boolean).length;
      root.querySelector('.ok-left').innerHTML = PR.left() ? `<b>${paid} de ${ids.length}</b> tributos pagos · restam <b>${PR.fmt(PR.left())}</b> Moonflesh` : '<b>Todos os tributos pagos.</b>';
    },
    tick(root, c) {
      root.querySelector('[data-c=d]').textContent = c.d;
      root.querySelector('[data-c=hm]').textContent = `${PR.pad(c.h)}:${PR.pad(c.m)}`;
    },
  });
})();
</script>
</body>
</html>
